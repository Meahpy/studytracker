[package]
name = "studytracker"
description = "Pelacak waktu belajar pribadi"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "studytracker"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Dipakai build produksi: aset frontend ditanam ke biner, bukan diambil dari devUrl.
# `tauri dev` menjalankan cargo dengan --no-default-features, jadi devUrl tetap dipakai saat ngoding.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
studytracker-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
] }
