name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ui:
    name: Frontend (check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build

  rust:
    name: Rust (test core, check workspace)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # tauri-build membaca tauri.conf.json dan menuntut folder dist sudah ada.
      - name: Build frontend untuk aset Tauri
        run: |
          npm ci
          npm --prefix ui ci
          npm --prefix ui run build

      - name: Tes logika core
        run: cargo test -p studytracker-core

      - name: Cek seluruh workspace
        run: cargo check --workspace --all-targets
